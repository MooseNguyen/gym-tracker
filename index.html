<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover + env(safe-area-inset-*) in CSS keep content clear of the notch / home bar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f110e" />
    <!-- Self-hosted fonts (public/fonts, precached by the service worker): no
         render-blocking request to a third party. The two used above the fold
         are preloaded; the rest load when first needed. -->
    <link rel="preload" href="/fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/barlow-condensed-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gym" />
    <title>Gym Tracker</title>
    <!-- Splash: painted before any JavaScript runs, replaced when React renders. -->
    <style>
      html {
        background: #0f110e;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background:
          radial-gradient(60% 40% at 100% 0%, rgb(169 204 69 / 0.14), transparent 70%),
          radial-gradient(70% 45% at 0% 100%, rgb(45 212 191 / 0.09), transparent 70%), #0f110e;
        color: #a9cc45;
      }
      .splash svg {
        width: 64px;
        height: 64px;
        animation: splash-lift 1.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .splash-bar {
        width: 96px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgb(169 204 69 / 0.18);
      }
      .splash-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #a9cc45;
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-lift {
        50% {
          transform: translateY(-8px) rotate(-6deg);
        }
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash svg,
        .splash-bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Loading">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12" />
        </svg>
        <div class="splash-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
