name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
        env:
          # The build only needs values to embed; nothing talks to Supabase here.
          VITE_SUPABASE_URL: https://ci.invalid
          VITE_SUPABASE_ANON_KEY: ci-anon-key

  e2e:
    name: E2E (WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Official image with the browsers and their system libraries baked in.
    # `playwright install --with-deps` spent 14+ minutes in apt on the runner.
    # Keep the tag equal to @playwright/test in package-lock.json: a mismatch
    # fails fast with "Executable doesn't exist".
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # playwright.config.ts starts the dev server with a mocked Supabase URL.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  migrations:
    name: Migrations + seed on a fresh database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The repo keeps no config.toml; defaults are enough for a throwaway DB.
      - run: npx supabase init
      # Real Supabase Postgres (auth schema included) in Docker:
      # applies every migration in order, then seed.sql.
      - run: npx supabase db start
      - name: Check the built-in library
        run: >
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1 -f supabase/tests/built_in_library.sql
      - name: Check who may write built-in exercises (RLS)
        run: >
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          -v ON_ERROR_STOP=1 -f supabase/tests/admin_rls.sql
